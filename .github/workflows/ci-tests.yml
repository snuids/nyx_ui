name: CI - Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vitest.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-tests.yml'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # same version as the production Dockerfile, so that the same npm is tested
          node-version: '22'
          cache: npm

      # `xlsx` comes from a remote tarball (cdn.sheetjs.com): the runner's npm 10 accepts it, as
      # in the build image. Locally, npm 11+ requires `--allow-remote=all`.
      - name: Install dependencies
        run: npm ci

      - name: Check the language files are aligned
        run: node scripts/check-lang-keys.mjs

      - name: Run the test suite with the coverage gate
        run: npm run test:coverage
