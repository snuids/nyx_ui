name: CI - Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vitest.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-tests.yml'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # meme version que le Dockerfile de production, pour tester le meme npm
          node-version: '22'
          cache: npm

      # `xlsx` vient d'un tarball distant (cdn.sheetjs.com) : npm 10 du runner l'accepte, comme
      # dans l'image de build. En local, npm 11+ exige `--allow-remote=all`.
      - name: Install dependencies
        run: npm ci

      - name: Check the language files are aligned
        run: node scripts/check-lang-keys.mjs

      - name: Run the test suite
        run: npm test
