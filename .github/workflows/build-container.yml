name: Build Docker Container

on:
  # `workflow_dispatch` exists to prove the version guard after a change to it: on a manual run
  # there is no commit message, so the run takes the "no version" path and must stay green.
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      # A licence or workflow change does not change the image, and its commit message carries
      # no version: the version step would fail on it.
      - 'LICENSE'
      - 'LICENCE'
      - '.github/**'
      # a change to the workflow itself does not change the image
      - '.github/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the language files are aligned
        run: node scripts/check-lang-keys.mjs

      # The tag is the version of the release, taken from the commit message. Squash, rebase and
      # merge commits all carry it (GitHub repeats the pull request title in the body of a merge
      # commit), and the pull request title is the fallback.
      #
      # A commit without a version is not a failure: it is a change that does not publish an image.
      # It used to `exit 1` here, which turned master red on every pull request that was not a
      # release — a red check that said nothing about the change. The run now says so with a
      # notice, and the build steps below are gated on the version being present.
      - name: Resolve the version
        id: extract_version
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION=$(printf '%s\n' "$HEAD_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)

          if [ -z "$VERSION" ]; then
            echo "No version in the commit message, reading the pull request title"
            PR_TITLE=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              | jq -r 'if type == "array" and length > 0 then .[0].title else empty end' 2>/dev/null || true)
            VERSION=$(printf '%s\n' "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          fi

          if [ -z "$VERSION" ]; then
            echo "::notice::No version (vX.Y.Z) in the commit message nor in the pull request title: this commit does not publish an image."
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up QEMU
        if: steps.extract_version.outputs.version != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.extract_version.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.extract_version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-platform Docker image
        if: steps.extract_version.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: snuids/nyx_ui:${{ steps.extract_version.outputs.version }}